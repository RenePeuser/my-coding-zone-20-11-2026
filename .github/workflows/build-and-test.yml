name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build code-rules.slnx

      - name: CodeRule tests (stage 2 and stage 5)
        run: dotnet test code-rules.slnx --no-build --filter "TestCategory~CodeRules"

      - name: All other tests
        run: dotnet test code-rules.slnx --no-build --filter "TestCategory!~CodeRules"
